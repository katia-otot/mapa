<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Recorrido - Mapa Local por la Memoria</title>
  <meta name="theme-color" content="#151413">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&display=swap">
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="recorrido.css">
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-8M7XSD0QGC"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());

    gtag('config', 'G-8M7XSD0QGC');
  </script>
</head>
<body class="recorrido-page">
  <header class="rec-bar">
    <div class="rec-bar-title">
      <p id="rec-kicker" class="rec-bar-kicker"></p>
      <h1 id="rec-title" class="rec-bar-heading">Recorrido</h1>
    </div>
    <a id="original-link" href="#" class="btn-ghost rec-bar-btn" target="_blank" rel="noopener">
      <span class="rec-hide-mobile">Ver mapa </span>original
    </a>
  </header>

  <main class="rec-main">
    <div id="rec-map" class="rec-map" role="region" aria-label="Mapa del recorrido"></div>
    <aside id="rec-panel" class="rec-panel" aria-live="polite"></aside>
  </main>

  <dialog id="lightbox" class="lightbox" aria-label="Foto ampliada">
    <img id="lightbox-img" alt="">
    <p id="lightbox-caption" class="lightbox-caption"></p>
    <div class="lightbox-actions">
      <button type="button" id="lightbox-prev" class="btn-ghost">← Anterior</button>
      <button type="button" id="lightbox-close" class="btn-ghost">Cerrar</button>
      <button type="button" id="lightbox-next" class="btn-ghost">Siguiente →</button>
    </div>
  </dialog>

  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
  <script src="temas.js"></script>
  <script src="recorrido.js"></script>
</body>
</html>
